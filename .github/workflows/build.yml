# Builds the Android APKs of the game on GitHub-hosted runners.
#
# Three APKs are produced on every run:
#   1. universal    -> contains both armeabi-v7a and arm64-v8a
#   2. armeabi-v7a  -> 32-bit ARM only (older devices)
#   3. arm64-v8a    -> 64-bit ARM only (most modern devices)
#
# The APKs are uploaded as workflow artifacts. Run it manually from the
# "Actions" tab (Build Android APKs -> Run workflow) or just push to the repo.
#
# Optional repository secrets for signing with your own key
# (if they are missing, a throwaway keystore is generated for each run):
#   ANDROID_KEYSTORE_BASE64    base64 of your .keystore / .jks file
#   ANDROID_KEYSTORE_ALIAS     key alias
#   ANDROID_KEYSTORE_PASSWORD  store + key password

name: Build Android APKs

on:
  workflow_dispatch:
    inputs:
      build-defines:
        type: string
        description: Extra build defines (e.g. -DFEATURE_DEBUG_FUNCTIONS)
        default: '-DGITHUB_BUILD'
      compress-textures:
        type: boolean
        description: Enable ASTC texture compression (slower build, lower memory usage)
        default: false
  push:
    branches-ignore:
      - 'gh-pages'
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  HAXE_VERSION: 4.3.7
  JAVA_VERSION: '17'
  ANDROID_NDK_VERSION: 29.0.13113456
  # Community builds can't use the Play Store services, so they are always disabled here.
  BASE_DEFINES: >-
    -DNO_FEATURE_MOBILE_ADVERTISEMENTS
    -DNO_FEATURE_MOBILE_IAP
    -DNO_FEATURE_MOBILE_IAR
    -DNO_FEATURE_MOBILE_AGESIGNALS

jobs:
  build-apk:
    name: APK (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: universal
            arch-defines: ''
          - name: armeabi-v7a
            arch-defines: '-DEXCLUDE_ARM64'
          - name: arm64-v8a
            arch-defines: '-DEXCLUDE_ARMV7'
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            build-tools;35.0.0
            platforms;android-29
            platforms;android-35
            ndk;${{ env.ANDROID_NDK_VERSION }}

      - name: Restore cached Haxe dependencies
        id: cache-haxelib
        uses: actions/cache@v4
        with:
          path: .haxelib
          key: haxelib-android-${{ runner.os }}-${{ hashFiles('hmm.json') }}

      - name: Configure haxelib
        run: |
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"
          haxelib --never --global git haxelib https://github.com/FunkinCrew/haxelib.git funkin-patches --skip-dependencies
          haxelib --never --global git hmm https://github.com/FunkinCrew/hmm funkin-patches
          haxelib --never newrepo
          haxelib version

      - name: Install Haxe dependencies
        if: steps.cache-haxelib.outputs.cache-hit != 'true'
        run: |
          git config --global advice.detachedHead false
          haxelib --global run hmm install -q
          haxelib --global list

      - name: Compile hxcpp tools
        run: |
          pushd .haxelib/hxcpp/git/tools/hxcpp
          haxe compile.hxml
          popd

      # Same sequence as docs/COMPILING_MOBILE.md and the FunkinCrew/Funkin#5949
      # guide (JDK 17, build-tools 35.0.0, NDK 29.0.13113456, platforms 29 + 35),
      # but non-interactive: `lime setup android` asks for the paths on stdin, so
      # they are written to lime's config file instead.
      - name: Tell lime where the Android SDK, NDK and JDK are
        run: |
          NDK_PATH="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          echo "SDK: $ANDROID_HOME"
          echo "NDK: $NDK_PATH"
          echo "JDK: $JAVA_HOME"
          test -d "$ANDROID_HOME"
          test -d "$NDK_PATH"
          test -d "$JAVA_HOME"

          mkdir -p "$HOME/.lime"
          cat > "$HOME/.lime/config.xml" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <config>
          	<section id="defines">
          		<set name="ANDROID_SDK" value="$ANDROID_HOME" />
          		<set name="ANDROID_NDK_ROOT" value="$NDK_PATH" />
          		<set name="JAVA_HOME" value="$JAVA_HOME" />
          		<set name="ANDROID_SETUP" value="true" />
          	</section>
          </config>
          EOF
          # Lime also reads these from the environment, so export them for later steps.
          {
            echo "ANDROID_SDK=$ANDROID_HOME"
            echo "ANDROID_NDK_ROOT=$NDK_PATH"
            echo "ANDROID_SETUP=true"
            echo "LIME_CONFIG=$HOME/.lime/config.xml"
          } >> "$GITHUB_ENV"
          cat "$HOME/.lime/config.xml"

      # Lime installed from git ships without its native library (lime.ndll), and
      # every `lime` command that touches the config or builds a project fails with
      # "Could not load lime.ndll" until it is compiled for the build machine (Linux).
      # This is the same thing the repo's own CI does (`lime rebuild cpp -64`).
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ gcc-multilib g++-multilib \
            libx11-dev libxi-dev libxext-dev libxinerama-dev libxrandr-dev \
            libgl-dev libgl1-mesa-dev libasound2-dev libpulse-dev

      - name: Prepare hxcpp
        run: |
          mkdir -p ci-logs
          haxelib run lime rebuild hxcpp 2>&1 | tee ci-logs/01-rebuild-hxcpp.log

      - name: Build lime native library for the runner (lime.ndll)
        run: |
          if find .haxelib/lime/git/ndll -ipath '*linux*' -name 'lime.ndll' 2>/dev/null | grep -q .; then
            echo "lime.ndll already present (restored from cache), skipping rebuild."
          else
            mkdir -p ci-logs
            haxelib run lime rebuild cpp -64 -v 2>&1 | tee ci-logs/02-rebuild-cpp.log
          fi
          find .haxelib/lime/git/ndll -name '*.ndll' | sort

      - name: Build lime native libraries for Android (only if they are missing)
        run: |
          if find .haxelib/lime/git/ndll -ipath '*android*' -name '*.so' 2>/dev/null | grep -q .; then
            echo "Android native libraries already present, skipping rebuild."
          else
            mkdir -p ci-logs
            haxelib run lime rebuild android -release -v 2>&1 | tee ci-logs/03-rebuild-android.log
          fi

      - name: Prepare signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS_SECRET: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/fnf-release.keystore"

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_ALIAS_SECRET" ] && [ -n "$KEYSTORE_PASSWORD_SECRET" ]; then
            echo "Using the keystore from repository secrets."
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            KEYSTORE_ALIAS="$KEYSTORE_ALIAS_SECRET"
            KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD_SECRET"
          else
            echo "No signing secrets found, generating a throwaway keystore."
            KEYSTORE_ALIAS=fnfci
            KEYSTORE_PASSWORD="$(openssl rand -hex 16)"
            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE_PATH" \
              -alias "$KEYSTORE_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=FNF CI, O=FNF, C=US"
          fi

          echo "::add-mask::$KEYSTORE_PASSWORD"
          {
            echo "KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "KEYSTORE_ALIAS=$KEYSTORE_ALIAS"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
          } > .env

      - name: Build APK (${{ matrix.name }})
        env:
          USER_DEFINES: ${{ github.event.inputs.build-defines || '-DGITHUB_BUILD' }}
          COMPRESS_TEXTURES: ${{ github.event.inputs.compress-textures || 'false' }}
        run: |
          DEFINES="$BASE_DEFINES $USER_DEFINES ${{ matrix.arch-defines }}"
          if [ "$COMPRESS_TEXTURES" != "true" ]; then
            DEFINES="$DEFINES -DNO_FEATURE_COMPRESSED_TEXTURES"
          fi
          echo "Build defines: $DEFINES"
          mkdir -p ci-logs
          haxelib run lime build android -release -v $DEFINES 2>&1 | tee ci-logs/04-build-${{ matrix.name }}.log
        timeout-minutes: 150

      - name: Collect APK
        run: |
          mkdir -p dist
          # Prefer the signed release APK and never pick an unsigned one.
          APK="$(find export/release/android -type f -name '*.apk' ! -name '*unsigned*' ! -name '*debug*' | sort | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::No release APK was found in export/release/android"
            find export/release/android -type f -name '*.apk' || true
            exit 1
          fi
          echo "Found: $APK"
          cp "$APK" "dist/FNF-${{ matrix.name }}.apk"
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FNF-${{ matrix.name }}-apk
          path: dist/FNF-${{ matrix.name }}.apk
          if-no-files-found: error
          retention-days: 30

      # TEMPORARY: the raw Actions logs can't be downloaded from the dev environment,
      # so when a step fails the command logs are pushed to a throwaway branch.
      # Delete this step (and the `permissions` block) once the build is green.
      - name: Publish logs of the failed build
        if: failure() && matrix.name == 'universal'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p ci-logs
          ls -la ci-logs
          OUT="$RUNNER_TEMP/logs-branch"
          rm -rf "$OUT"; mkdir -p "$OUT"; cd "$OUT"
          git init -q
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          for f in "$GITHUB_WORKSPACE"/ci-logs/*.log; do
            [ -f "$f" ] || continue
            tail -n 4000 "$f" > "$(basename "$f").tail.txt"
          done
          echo "run=$GITHUB_RUN_ID sha=$GITHUB_SHA" > INFO.txt
          git add -A
          git commit -q -m "CI logs for run $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-logs-latest
